name: ${COMPOSE_PROJECT_NAME:-classlab}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-nc-env: &nc-env
  POSTGRES_HOST: db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?Run init_env.py first}
  REDIS_HOST: redis
  NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-labadmin}
  NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?Run init_env.py first}
  NEXTCLOUD_TRUSTED_DOMAINS: cloud.lab.test:8443
  TRUSTED_PROXIES: ${CADDY_NC_IP:-172.28.250.2}
  OVERWRITEHOST: cloud.lab.test:8443
  OVERWRITEPROTOCOL: https
  OVERWRITECLIURL: https://cloud.lab.test:8443
  APACHE_DISABLE_REWRITE_IP: "1"
  PHP_MEMORY_LIMIT: 512M
  PHP_UPLOAD_LIMIT: 512M

services:
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    networks:
      nc_front:
        ipv4_address: ${CADDY_NC_IP:-172.28.250.2}
      vault_net: {}
      status_net: {}
    logging: *logging

  vaultwarden:
    image: ${VAULTWARDEN_IMAGE:-vaultwarden/server:latest}
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.lab.test:8443
      SIGNUPS_ALLOWED: ${VW_SIGNUPS_ALLOWED:-false}
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      # No ADMIN_TOKEN: the separate server administration panel stays disabled.
    volumes:
      - ./data/vaultwarden:/data
    networks: [vault_net]
    logging: *logging

  nextcloud:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:apache}
    restart: unless-stopped
    environment: *nc-env
    volumes:
      - ./data/nextcloud:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      nc_front:
        ipv4_address: ${NEXTCLOUD_NC_IP:-172.28.250.3}
      nc_back: {}
    logging: *logging

  cron:
    image: ${NEXTCLOUD_IMAGE:-nextcloud:apache}
    restart: unless-stopped
    entrypoint: /cron.sh
    environment: *nc-env
    volumes:
      - ./data/nextcloud:/var/www/html
    depends_on: [nextcloud]
    networks: [nc_back, cron_egress]
    logging: *logging

  db:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NC_DB_PASSWORD:?Run init_env.py first}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nc_back]
    logging: *logging

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nc_back]
    logging: *logging

  uptime-kuma:
    image: ${KUMA_IMAGE:-louislam/uptime-kuma:2}
    restart: unless-stopped
    volumes:
      - ./data/kuma:/app/data
    networks: [status_net]
    logging: *logging

networks:
  nc_front:
    ipam:
      config:
        - subnet: ${NC_FRONT_SUBNET:-172.28.250.0/24}
  nc_back:
    internal: true
  vault_net: {}
  status_net: {}
  cron_egress: {}
